name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive

      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      # Unit tests with coverage; fails below each workspace's thresholds (vitest.config.ts).
      - run: yarn coverage
      - run: yarn build:storybook
      - run: yarn build

      - name: Install Playwright browser
        run: yarn workspace @pgo/web playwright install --with-deps chromium

      - run: yarn e2e

      # The realtime image is only deployed from main; build it on every run so a broken
      # Dockerfile shows up in the PR.
      - name: Build realtime image
        run: docker build -f services/realtime/Dockerfile -t pgo-realtime:ci .

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  rust:
    name: Rust and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/downsample/rust

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive

      # cargo fmt --check, clippy -D warnings, cargo test.
      - run: yarn wasm:test
      # Rebuild the WASM and check JS/WASM parity against the fresh build. The committed
      # packages/downsample/pkg is not diffed: builds are not byte-identical across platforms.
      - run: yarn wasm:build
      - run: yarn workspace @pgo/downsample test

  deploy-web:
    name: Deploy to Cloud Run
    needs: [checks, rust]
    # Deploys only pushes to main, once the GCP variables exist (see docs/deploy.md).
    # Pushes to development and pull requests run the checks only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no service-account key in GitHub.
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/web/pgo-web:${{ github.sha }}
      REALTIME_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/web/pgo-realtime:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          docker build -f apps/web/Dockerfile -t "$IMAGE" .
          docker build -f services/realtime/Dockerfile -t "$REALTIME_IMAGE" .
          docker push "$IMAGE"
          docker push "$REALTIME_IMAGE"

      # First, so the web app can be given its URL.
      - name: Deploy realtime service
        id: realtime
        run: |
          # One instance holds the shared alarm state. A WebSocket lasts at most --timeout
          # (60 min); the page then reconnects.
          gcloud run deploy pgo-realtime \
            --image "$REALTIME_IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 3600 \
            --min-instances 0 \
            --max-instances 1 \
            --quiet
          URL=$(gcloud run services describe pgo-realtime --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          echo "url=wss://${URL#https://}" >> "$GITHUB_OUTPUT"

      - name: Deploy web
        env:
          # Name of the Secret Manager secret holding the EIA key. Until the repository variable
          # EIA_SECRET_NAME is set, the app serves the committed EIA snapshot.
          EIA_SECRET_NAME: ${{ vars.EIA_SECRET_NAME }}
        run: |
          SECRETS=()
          if [ -n "$EIA_SECRET_NAME" ]; then
            SECRETS=(--set-secrets "EIA_API_KEY=${EIA_SECRET_NAME}:latest")
          fi
          gcloud run deploy pgo-web \
            "${SECRETS[@]}" \
            --update-env-vars "REALTIME_URL=${{ steps.realtime.outputs.url }}" \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3 \
            --quiet
