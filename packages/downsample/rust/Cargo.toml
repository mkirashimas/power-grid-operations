[package]
name = "pgo-downsample"
version = "0.1.0"
edition = "2021"
description = "Min/max and LTTB downsampling of time series, compiled to WebAssembly."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
